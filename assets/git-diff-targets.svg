<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">git diff 与 git diff --staged 的比较对象</title>
  <desc id="desc">diff 比较工作区和暂存区，diff --staged 比较暂存区和上次提交。</desc>
  <rect width="900" height="360" rx="28" fill="#fffaf2" />
  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="450" y="46" text-anchor="middle" font-size="22" font-weight="800" fill="#1f2933">git diff 到底在比较什么？</text>

    <rect x="70" y="150" width="210" height="120" rx="20" fill="#ffe3d7" />
    <text x="175" y="192" text-anchor="middle" font-size="20" font-weight="800" fill="#1f2933">工作区</text>
    <text x="175" y="222" text-anchor="middle" font-size="14" fill="#5f6c7b">正在编辑的最新内容</text>

    <rect x="345" y="150" width="210" height="120" rx="20" fill="#eef8f4" />
    <text x="450" y="192" text-anchor="middle" font-size="20" font-weight="800" fill="#1f2933">暂存区</text>
    <text x="450" y="222" text-anchor="middle" font-size="14" fill="#5f6c7b">git add 选中的内容</text>

    <rect x="620" y="150" width="210" height="120" rx="20" fill="#edf2ff" />
    <text x="725" y="186" text-anchor="middle" font-size="20" font-weight="800" fill="#1f2933">上次提交</text>
    <text x="725" y="210" text-anchor="middle" font-size="14" fill="#5f6c7b">HEAD</text>
    <text x="725" y="234" text-anchor="middle" font-size="14" fill="#5f6c7b">已保存快照</text>

    <g stroke="#bd3d2b" stroke-width="5" stroke-linecap="round">
      <path d="M286 210 H339" />
      <path d="M561 210 H614" />
    </g>
    <text x="312" y="128" text-anchor="middle" font-size="17" font-weight="800" fill="#bd3d2b">git diff</text>
    <text x="587" y="128" text-anchor="middle" font-size="17" font-weight="800" fill="#bd3d2b">git diff --staged</text>

    <text x="450" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#5f6c7b">diff 看“还没暂存的改动”，diff --staged 看“即将被提交的改动”。</text>
  </g>
</svg>