<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">为什么使用分支</title>
  <desc id="desc">主线之外并行多条功能分支，互不影响，改坏了也不影响别人。</desc>
  <rect width="900" height="360" rx="28" fill="#fffaf2" />
  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="800" fill="#1f2933">为什么用分支：给自己一块能放手试的试验田</text>
    <text x="450" y="78" text-anchor="middle" font-size="16" fill="#5f6c7b">主线保持稳定，新功能在支线上安全推进，互不干扰</text>

    <g stroke="#2f9e7e" stroke-width="5" stroke-linecap="round">
      <path d="M116 200 H784" />
    </g>
    <g fill="#eef8f4" stroke="#2f9e7e" stroke-width="4">
      <circle cx="140" cy="200" r="24" />
      <circle cx="300" cy="200" r="24" />
      <circle cx="460" cy="200" r="24" />
      <circle cx="620" cy="200" r="24" />
      <circle cx="780" cy="200" r="24" />
    </g>
    <text x="140" y="252" text-anchor="middle" font-size="15" font-weight="800" fill="#1f2933">main 主分支</text>

    <path d="M300 200 C 300 140, 360 140, 380 140" fill="none" stroke="#5570d9" stroke-width="5" stroke-linecap="round" />
    <g fill="#edf2ff" stroke="#5570d9" stroke-width="4">
      <circle cx="380" cy="140" r="24" />
      <circle cx="500" cy="140" r="24" />
    </g>
    <text x="440" y="100" text-anchor="middle" font-size="15" font-weight="800" fill="#1f2933">feature-A 新功能</text>

    <path d="M460 200 C 460 260, 520 260, 540 260" fill="none" stroke="#bd3d2b" stroke-width="5" stroke-linecap="round" />
    <g fill="#ffe3d7" stroke="#bd3d2b" stroke-width="4">
      <circle cx="540" cy="260" r="24" />
      <circle cx="660" cy="260" r="24" />
    </g>
    <text x="600" y="322" text-anchor="middle" font-size="15" font-weight="800" fill="#1f2933">feature-B 新功能</text>

    <text x="450" y="346" text-anchor="middle" font-size="17" font-weight="700" fill="#5f6c7b">每条分支都是一份独立副本，改坏了也不影响别人。</text>
  </g>
</svg>