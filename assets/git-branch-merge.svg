<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">合并分支</title>
  <desc id="desc">回到目标分支后用 git merge 把功能分支的提交接回来。</desc>
  <rect width="900" height="360" rx="28" fill="#fffaf2" />
  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="800" fill="#1f2933">合并：把分支上写的提交接回当前分支</text>

    <g stroke="#2f9e7e" stroke-width="5" stroke-linecap="round">
      <path d="M130 216 H820" />
    </g>
    <g fill="#eef8f4" stroke="#2f9e7e" stroke-width="4">
      <circle cx="150" cy="216" r="20" />
      <circle cx="290" cy="216" r="20" />
      <circle cx="760" cy="216" r="20" />
    </g>
    <circle cx="640" cy="216" r="30" fill="#fff3c4" stroke="#d69e2e" stroke-width="5" />
    <text x="640" y="222" text-anchor="middle" font-size="15" font-weight="800" fill="#1f2933">合并</text>

    <path d="M290 216 C 290 130, 380 130, 430 130" fill="none" stroke="#5570d9" stroke-width="5" stroke-linecap="round" />
    <path d="M570 130 C 600 170, 620 200, 640 216" fill="none" stroke="#5570d9" stroke-width="5" stroke-linecap="round" />
    <g fill="#edf2ff" stroke="#5570d9" stroke-width="4">
      <circle cx="430" cy="130" r="20" />
      <circle cx="570" cy="130" r="20" />
    </g>
    <text x="500" y="90" text-anchor="middle" font-size="15" font-weight="800" fill="#1f2933">feature 上做的提交</text>

    <g>
      <rect x="60" y="270" width="360" height="62" rx="16" fill="#edf2ff" />
      <text x="84" y="294" font-family="SFMono-Regular,Consolas,monospace" font-size="16" font-weight="800" fill="#1f2933">git switch main</text>
      <text x="84" y="318" font-size="14" fill="#5f6c7b">先回到要接收改动的目标分支</text>
      </g>

    <rect x="470" y="270" width="360" height="62" rx="16" fill="#fff3c4" />
    <text x="494" y="294" font-family="SFMono-Regular,Consolas,monospace" font-size="16" font-weight="800" fill="#1f2933">git merge feature</text>
    <text x="494" y="318" font-size="14" fill="#5f6c7b">把 feature 的提交并入 main</text>

    <text x="450" y="350" text-anchor="middle" font-size="16" font-weight="700" fill="#5f6c7b">merge 大多数时候是自动完成的，安全又平常。</text>
  </g>
</svg>